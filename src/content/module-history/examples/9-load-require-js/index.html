<html lang="en">
  <head>
    ...
  </head>
  <body>
    <!-- [!code highlight:10] -->
    <h1>This HTML will be parsed before the require.js script is loaded</h1>
    <button>This button will be interactive while ui.js is loading</button>
    <!-- require.js will be loaded synchronously -->
    <script src="require.js"></script>
    <script>
      // ui.js will be loaded asynchronously
      require(['./ui.js'], function (ui) {
        ui.init();
      });
    </script>
  </body>
</html>
